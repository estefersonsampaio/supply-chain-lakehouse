version: 2

models:
  - name: dim_material
    description: Material master with its main supplier. PA = finished product, MP = component.
    columns:
      - name: material_code
        data_tests: [unique, not_null]
      - name: material_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["PA", "MP"]
      - name: unit
        data_tests:
          - accepted_values:
              arguments:
                values: ["PC", "KG", "L"]
      - name: main_supplier_code
        description: Empty for finished products (they are produced, not bought)
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_code

  - name: dim_supplier
    columns:
      - name: supplier_code
        data_tests: [unique, not_null]

  - name: dim_customer
    columns:
      - name: customer_code
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar covering every date used by the facts. The plant works Monday to Friday.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
