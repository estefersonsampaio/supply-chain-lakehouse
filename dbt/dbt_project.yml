name: supply_chain
version: "1.0.0"
profile: supply_chain

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # days of firm demand used to compute stock coverage
  coverage_horizon_days: 10

models:
  supply_chain:
    +materialized: table
    +file_format: delta
    dimensions:
      +tags: ["dimension"]
    facts:
      +tags: ["fact"]
    kpis:
      +tags: ["kpi"]
