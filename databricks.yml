# Databricks Asset Bundle: everything the pipeline needs in the workspace, as code.
#
#   databricks bundle validate -p <profile>
#   databricks bundle deploy   -p <profile>
#   databricks bundle run supply_chain_pipeline -p <profile>
#
# The workspace host comes from the CLI profile, so no workspace URL is stored here.

bundle:
  name: supply_chain_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds all schemas
    default: workspace
  schedule_status:
    description: PAUSED or UNPAUSED for the daily schedule of the pipeline job
    default: PAUSED
  warehouse_id:
    description: SQL warehouse used by dbt (looked up by name, no ID stored here)
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
