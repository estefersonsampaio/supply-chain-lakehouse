[project]
name = "supply-chain-lakehouse"
version = "0.1.0"
description = "Supply chain (MRP) data pipeline on Databricks with simulated ERP data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Esteferson Sampaio" }]
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supply_chain_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
