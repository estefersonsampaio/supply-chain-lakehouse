resources:
  jobs:
    supply_chain_pipeline:
      name: supply_chain_pipeline
      description: Landing CSV files -> bronze -> silver (data quality gate) -> gold (dbt)
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_ingest
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/bronze_ingest.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --landing
              - /Volumes/${var.catalog}/${resources.schemas.sc_landing.name}/${resources.volumes.erp_extracts.name}
              - --checkpoints
              - /Volumes/${var.catalog}/${resources.schemas.sc_bronze.name}/${resources.volumes.checkpoints.name}
              - --schema
              - ${resources.schemas.sc_bronze.name}
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/silver_transform.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${resources.schemas.sc_bronze.name}
              - --silver-schema
              - ${resources.schemas.sc_silver.name}
              - --manifests
              - /Volumes/${var.catalog}/${resources.schemas.sc_landing.name}/${resources.volumes.erp_extracts.name}/_manifest
        - task_key: gold_dbt
          depends_on:
            - task_key: silver_transform
          environment_key: dbt
          dbt_task:
            project_directory: ${workspace.file_path}/dbt
            commands:
              - dbt build
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${resources.schemas.sc_gold.name}
      environments:
        - environment_key: default
          spec:
            client: "2"
        - environment_key: dbt
          spec:
            client: "2"
            dependencies:
              - dbt-databricks>=1.10,<2
